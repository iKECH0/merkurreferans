name: 📱 Build Android App (AAB & APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android:
    name: 🚀 Build Google Play AAB & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Proje Kodlarını Çek (Checkout)
        uses: actions/checkout@v4

      - name: ☕ Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      - name: 🟢 Node.js 20 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: 📦 Mobil Paketleri Yükle
        run: |
          cd mobile
          npm install

      - name: ⚙️ Expo Prebuild & İmzalama Yapılandırması
        run: |
          cd mobile
          npx expo prebuild --platform android --clean
          node configure-signing.js

      - name: 🔨 Google Play için AAB Derle (bundleRelease)
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: 🔨 Doğrudan Yükleme için APK Derle
        run: |
          cd mobile/android
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: 📂 Çıktıları Hazırla
        run: |
          mkdir -p output
          find mobile/android/app/build/outputs/bundle/ -name "*.aab" -exec cp {} output/MerkurReferans.aab \;
          find mobile/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/MerkurReferans.apk \;
          echo "Üretilen dosyalar:"
          ls -lh output/

      - name: 📤 Google Play AAB Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: MerkurReferans-GooglePlay-AAB
          path: output/MerkurReferans.aab
          retention-days: 30

      - name: 📤 Test APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: MerkurReferans-Test-APK
          path: output/MerkurReferans.apk
          retention-days: 30
